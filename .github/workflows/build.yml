name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The library is portable C, so the same sources must build and pass the same tests
  # on all three desktop targets. This job is the proof of that claim.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # The two-node pairing test uses real sockets and threads, so it is the closest
      # thing to an integration test the desktop side has.
      - name: Pairing over real sockets
        if: matrix.name == 'linux'
        run: ./build/cairn_tests 2>&1 | tail -20

  # The Android demo is the main target of the library, so it gets a real build on
  # every push and its APK is kept as an artifact.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK and CMake
        # The runner image ships an Android SDK, so the setup action is not needed and
        # its licence prompt is exactly what made this job fail. sdkmanager is called
        # directly, with the licences accepted first.
        run: |
          if ! command -v sdkmanager > /dev/null; then
            echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          fi
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1" \
            "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          # The repository carries no wrapper, because generating one needs a Gradle
          # install. CI pins the version instead, so the build stays reproducible.
          gradle-version: '8.7'

      - name: Build the debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --console=plain

      - name: Report what was produced
        run: ls -l android/app/build/outputs/apk/debug/

      - uses: actions/upload-artifact@v4
        with:
          name: cairn-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # A release tag gets the APK attached to the release itself, which is what
      # someone installing it actually needs.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/*.apk
